<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paryrum — Painel do Bibliotecário</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">
    <style>
        /* Reutilizando a estilização das tabelas */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table th {
            background-color: var(--bg-sidebar);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .data-table td {
            color: var(--text-primary);
            font-size: 0.88rem;
        }
        .data-table tbody tr:hover {
            background-color: var(--card-hover);
        }
        .btn-table-action {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            margin-right: 5px;
        }
        .btn-table-edit { background: rgba(79,142,247,0.15); color: var(--accent-light); }
        .btn-table-edit:hover { background: var(--accent); color: #fff; }
        .btn-table-delete { background: rgba(231,76,60,0.15); color: var(--danger); }
        .btn-table-delete:hover { background: var(--danger); color: #fff; }
        .btn-table-success { background: rgba(46,204,113,0.15); color: var(--success); }
        .btn-table-success:hover { background: var(--success); color: #fff; }
    </style>
</head>
<body>

    <main class="main-content" style="max-width: 1200px; margin: 0 auto; position: relative;">

        <button id="logout-btn" class="btn-logout" style="width: auto; position: absolute; top: 32px; right: 32px; padding: 8px 16px;">
            Sair
        </button>

        <div class="schedule-header">
            <div>
                <h2>Painel do Bibliotecário</h2>
                <p class="subtitle">Gerencie o acervo de livros e controle as devoluções do sistema</p>
            </div>
            <button id="btn-novo-livro" class="btn-primary" style="background-color: var(--accent); margin-right: 90px;">
                + Cadastrar Nova Obra
            </button>
        </div>

        <div class="settings-card" style="margin-top: 2rem;">
            <div class="section-label">Controle de Empréstimos e Devoluções</div>
                <div class="form-group textarea">
                    <input type="text" id="busca-emprestimo" placeholder="Buscar por leitor ou título do livro..." class="search-input">
                </div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Leitor</th>
                            <th>Livro</th>
                            <th>Data Empréstimo</th>
                            <th>Devolução Prevista</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-emprestimos-adm">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="settings-card" style="margin-top: 2rem;">
            <div class="section-label">Catálogo Geral do Acervo</div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Ano</th>
                            <th>Estoque Disponível</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-livros-adm">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="modal-livro" class="modal">
        <div class="modal-content">
            <button class="close-modal" id="btn-fechar-modal-x">&times;</button>
            <h3 id="modal-titulo-livro">Cadastrar Nova Obra</h3>
            
            <form id="form-livro" class="settings-form">
                <input type="hidden" id="edit-book-id">

                <div class="form-group">
                    <label for="book-title">Título da Obra: *</label>
                    <input type="text" id="book-title" placeholder="Ex: Dom Casmurro" required>
                </div>

                <div class="form-group">
                    <label for="book-author">Autor: *</label>
                    <input type="text" id="book-author" placeholder="Ex: Machado de Assis" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="book-year">Ano de Publicação:</label>
                        <input type="number" id="book-year" placeholder="Ex: 1899">
                    </div>
                    <div class="form-group">
                        <label for="book-quantity">Quantidade em Estoque: *</label>
                        <input type="number" id="book-quantity" min="0" value="1" required>
                    </div>
                </div>

                <div class="form-row" style="margin-top: 10px;">
                    <button type="button" id="btn-fechar-modal" class="btn-danger" style="background: transparent; border: 1px solid var(--border); color: var(--text-muted);">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Obra</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/bibliotecario.js"></script>
</body>
</html>
